graph_construction:
  build_graphs:
    used_method: orthrus
    use_all_files: True
    time_window_size: 15.0
    use_hashed_label: True
    node_label_features:
      subject: type, path, cmd_line
      file: type, path
      netflow: type, remote_ip, remote_port

edge_featurization:
  embed_nodes:
    emb_dim: 128
    used_method: feature_word2vec
    use_seed: True
    feature_word2vec:
      show_epoch_loss: True
      window_size: 5
      min_count: 1
      use_skip_gram: True
      num_workers: 6
      epochs: 50
      compute_loss: True
      negative: 5
      use_node_types: False
      use_cmd: True
      use_port: False
      decline_rate: 30
  embed_edges:
    to_remove: True

detection:
  gnn_training:
    used_method: orthrus
    use_seed: True
    num_epochs: 6
    lr: 0.00001
    weight_decay: 0.00001
    node_hid_dim: 128
    node_out_dim: 64
    # Experimental objectives are opt-in. The safe default reproduces mean
    # cross entropy; ECHO/DATR must be enabled explicitly by a run command.
    alignment:
      enabled: False
      tail_fraction: 0.10
      tail_weight: 0.50
      class_balance_beta: 0.999
      max_class_weight: 10.0
      ema_enabled: True
      ema_decay: 0.995
      ema_start_epoch: 2
      save_ema_checkpoint: True
      # Avoid saving a multi-GB neighbor-loader snapshot at every epoch.
      # "all" is reserved for an explicitly labelled oracle experiment.
      checkpoint_save_policy: ema_only
      checkpoint_save_last_k: 5
      # ECHO: shared temporal encoder with bootstrapped semantic heads.  The
      # disagreement term estimates epistemic novelty without attack labels.
      uncertainty:
        enabled: False
        num_heads: 3
        bootstrap_keep_probability: 0.80
        disagreement_weight: 0.50
      # TRACE: temporally ordered interaction/entity/gap evidence. Uncertainty
      # is exported separately and never added to the anomaly score.
      trace:
        enabled: False
        num_heads: 3
        bootstrap_keep_probability: 0.80
        entity_weight: 0.25
        temporal_weight: 0.10
        stats_start_epoch: 5
        min_scale: 0.001
      # TRACE-Open: attack-label-free, type-preserving virtual exposure and
      # full prediction-distribution prototypes. Requires trace.enabled=true.
      trace_open:
        enabled: False
        exposure_weight: 0.25
        prototype_momentum: 0.95
    encoder:
      use_node_type_in_node_feats: True
      neighbor_sampling: []
      edge_features: edge_type
      use_node_feats_in_gnn: True
      neighbor_size: 20
      temporal_dim: 100
      batch_size: 1024
      graph_attention:
        dropout: 0.5
        activation: relu
        num_heads: 8
    decoder:
      used_methods: predict_edge_type
      predict_edge_type:
        used_method: custom
        custom:
          dropout: 0.0
          num_layers: 2
          activation: relu

  gnn_testing:
    threshold_method: str
    # ema_only avoids evaluating and storing 20 redundant edge-loss copies.
    # Use "all" only for an explicitly labelled oracle/sensitivity analysis.
    checkpoint_policy: ema_only
    checkpoint_last_k: 5
    # validation_loss evaluates every lightweight epoch on validation, keeps a
    # manifest, then tests only the selected epoch. Non-selected raw validation
    # CSVs are redundant once their aggregate loss is recorded.
    retain_validation_candidates: False
  evaluation:
    viz_malicious_nodes: False
    ground_truth_version: darpa
    used_method: node_evaluation
    # The headline result never reads test labels to select a checkpoint.
    checkpoint_selection: fixed_ema
    fixed_epoch: 20
    node_evaluation:
      threshold_method: max_val_loss
      use_dst_node_loss: True
      use_kmeans: True
      kmeans_top_K: 20
      # Keep raw ORTHRUS scores by default. The earlier edge-type robust
      # normalizer is retained only for negative-result reproduction.
      score_normalization: none
      normalization_min_scale_ratio: 0.10
      # Validation-only routing threshold. It does not change the binary score
      # or read test labels; it separates confirmed alerts from review cases.
      trace_uncertainty_quantile: 0.99

attack_reconstruction :
  tracing:
    used_method: depimpact
    depimpact:
      used_method: component
      score_method: degree
      workers: 8
      visualize: False
